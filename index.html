<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei","PingFang SC","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
:root{--bg:#f0f7ff;--fg:#1f2933;--card:#fff;--ac:#2b7bba;--tip:#e8f2fc;--mu:#667;--bd:#d5e3f0;--ok:#2e9e6a;

:root[data-theme="dark"]{--bg:#0f1a26;--fg:#e6eef7;--card:#18283a;--ac:#6db3ea;--tip:#1f3650;--mu:#9fb3c8;--bd:#2c4560}
body{background:var(--bg);color:var(--fg);line-height:1.65}
header{background:radial-gradient(circle at 70% 0,#1fb5c9 0,transparent 55%),linear-gradient(135deg,#0b2a4a,#1b5e9b);color:#fff;padding:1.6rem 1rem 2.4rem;text-align:center}header h1{font-size:2.6rem;letter-spacing:-.5px}header h1 span{color:#5ee0ef}.tag{font-size:1.25rem;font-weight:600;margin-top:.5rem}.chips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin:1rem 0}.chips i{font-style:normal;background:#ffffff22;border:1px solid #ffffff44;border-radius:16px;padding:.25rem .8rem;font-size:.85rem}.cta{display:inline-block;background:#5ee0ef;color:#06283d;font-weight:700;padding:.7rem 1.6rem;border-radius:26px;text-decoration:none}
header p{opacity:.92;margin-top:.4rem;font-size:.95rem}
.lang{display:flex;justify-content:center;gap:.4rem;margin-bottom:.9rem}
.lang button{border:1px solid #fff9;background:transparent;color:#fff;padding:.3rem .9rem;border-radius:16px;cursor:pointer}
.lang button.on{background:#fff;color:#2b7bba;font-weight:700}
main{max-width:880px;margin:0 auto;padding:1.2rem}
.card{background:var(--card);border-radius:12px;padding:1.3rem;margin-bottom:1.2rem;box-shadow:0 2px 8px #00000015}
h2{color:var(--ac);margin-bottom:.8rem;font-size:1.15rem}
label{display:block;font-weight:600;margin:.9rem 0 .4rem}

.opts button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input[type=range]{width:100%;accent-color:#2b7bba}
.btn{margin-top:1rem;padding:.75rem 1rem;border:0;border-radius:10px;background:#2b7bba;color:#fff;font-size:1rem;cursor:pointer}
.btn.g{background:transparent;color:var(--ac);border:1px solid var(--bd);margin-left:.5rem}
.go{width:100%;font-size:1.05rem}
.ex{border:1px solid var(--bd);border-radius:10px;padding:.8rem 1rem;margin-bottom:.7rem;display:flex;gap:.8rem;align-items:flex-start}
.ex input{margin-top:.35rem;width:1.15rem;height:1.15rem;accent-color:#2e9e6a}
.ex b{color:var(--ac)} .ex small{display:block;color:var(--mu)}
.bar{height:10px;background:var(--tip);border-radius:6px;overflow:hidden;margin:.4rem 0 1rem}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.alert{background:#fdecea;color:#8a1f17;border-left:4px solid #d93025;padding:.8rem 1rem;border-radius:6px;margin-bottom:.8rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .alert{background:#3a1b19;color:#ffb4ab}}
.tip{background:var(--tip);padding:1rem;border-left:4px solid var(--ac);border-radius:6px;font-size:.92rem;margin-top:.8rem}
ul{padding-left:1.3rem} li{margin:.2rem 0}
.chart{overflow-x:auto;margin-top:.8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.8rem}
.grid div{background:var(--tip);border-radius:10px;padding:.9rem}
.grid b{color:var(--ac);display:block;margin-bottom:.2rem}
.mu{color:var(--mu);font-size:.9rem}
footer{text-align:center;padding:1.2rem;color:var(--mu);font-size:.85rem}
.hide{display:none}
.demo{display:grid;grid-template-columns:minmax(200px,260px) 1fr;gap:1rem;align-items:center}@media(max-width:620px){.demo{grid-template-columns:1fr}}
#fig{width:100%;background:var(--tip);border-radius:12px}.score{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.9rem}.score div{background:var(--tip);border-radius:10px;padding:.6rem;text-align:center}.score small{display:block;color:var(--mu);font-size:.78rem}.score b{font-size:1.3rem;color:var(--ac)}
.fb{margin-top:.8rem;padding:.7rem 1rem;border-radius:8px;font-weight:600;background:var(--tip);border-left:4px solid var(--ac)}.fb.ok{border-color:#2e9e6a}.fb.bad{border-color:#d93025}
.road{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem}.road div{border:1px solid var(--bd);border-radius:10px;padding:.9rem}.road b{color:var(--ac)}.road em{display:block;font-style:normal;font-size:.78rem;color:var(--mu)}
:focus-visible{outline:3px solid #5ee0ef;outline-offset:2px}.opts button,.btn{min-height:44px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
h3{font-size:1rem;margin:1.1rem 0 .4rem;color:var(--ac)}
.trace{list-style:none;padding:0;margin:.8rem 0}.trace li{display:grid;grid-template-columns:6rem 1fr;column-gap:.8rem;padding:.6rem .8rem;border-left:3px solid var(--ac);background:var(--tip);border-radius:6px;margin-bottom:.5rem;font-size:.92rem}.trace li.blk{border-color:#d93025}.trace b{grid-row:1/3;color:var(--ac)}.trace code{font-size:.78rem;color:var(--mu);word-break:break-all}
pre{background:#0b1b2b;color:#cfe8ff;padding:.8rem;border-radius:8px;overflow:auto;font-size:.78rem;margin:.6rem 0;max-height:300px}
summary{cursor:pointer;color:var(--ac);font-weight:600;margin-top:.6rem}
.cta.ghost{background:transparent;color:#fff;border:1px solid #ffffffaa;cursor:pointer;font-size:1rem;margin-left:.5rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.8rem;margin:.6rem 0}.stats div{background:var(--tip);border-radius:12px;padding:1rem;text-align:center}.stats b{display:block;font-size:2.4rem;color:var(--ac);line-height:1.1}.stats span{font-size:.92rem}
.src{font-size:.8rem;color:var(--mu);margin:.5rem 0}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;margin-top:.6rem}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:260px}.hm i{aspect-ratio:1;border-radius:4px;background:var(--bd)}.hm i.d{background:#2e9e6a}
.warn{background:#fff4d6;color:#6b4a00;padding:.5rem .8rem;border-radius:8px;font-size:.88rem;margin:.5rem 0}
.tb{width:100%;border-collapse:collapse;font-size:.92rem}.tb td{padding:.5rem .3rem;border-bottom:1px solid var(--bd)}.tb td+td{text-align:right}
.bg{display:inline-block;padding:.1rem .65rem;border-radius:10px;font-size:.78rem;font-weight:700;background:#e3ecf5;color:#1d4f7a;white-space:nowrap}.bg.real{background:#dff5e8;color:#14693f}.bg.sim,.bg.syn{background:#fff4d6;color:#6b4a00}
#bn{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;align-items:center;justify-content:center;gap:.6rem;padding:.7rem .8rem calc(.7rem + env(safe-area-inset-bottom,0px));background:#0b2a4af2}#bn.hide{display:none}
#bn button{min-width:44px;min-height:44px;border-radius:22px;border:1px solid #ffffff66;background:transparent;color:#fff;font-size:1.1rem;cursor:pointer}
#bd{display:flex;gap:.2rem}#bd button{min-width:0;width:22px;min-height:22px;height:22px;padding:0;border:0;background:transparent;position:relative}#bd button:after{content:"";position:absolute;inset:6px;border-radius:50%;background:#ffffff55}#bd button.on:after{background:#5ee0ef}
#bpg{position:absolute;top:0;left:0;height:3px;background:#5ee0ef;width:0}
body.booth{font-size:112%}body.booth .card{display:none}body.booth .card.on:not(.hide){display:block;animation:fi .5s}body.booth main{padding-bottom:6rem}
body.booth header{padding:.8rem 1rem}body.booth header h1{font-size:1.8rem}body.booth .tag,body.booth .chips,body.booth .cta{display:none}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media print{.lang,.cta,#bn,.btn{display:none!important}.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}header{background:#0b2a4a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<header>
<div class="lang" id="lang"></div>
<h1>ReMotion <span>AI</span></h1>
<p class="tag" data-t="tag"></p>
<div class="chips"><i data-t="c1"></i><i data-t="c2"></i><i data-t="c3"></i></div>
<a class="cta" href="#demo" data-t="cta"></a><button type="button" class="cta ghost" id="bo" data-t="xbo"></button>
</header>
<main>
<div class="card" id="prob" data-g="0"><h2 data-t="xph"></h2><div class="stats" id="stats"></div><p class="src" data-t="xsrc"></p><div class="tip" data-t="xans"></div></div>

<div class="card" id="demo" data-g="1">
<h2 data-t="hd"></h2><p class="mu" data-t="dd"></p>
<div class="demo"><svg id="fig" viewBox="0 -70 270 340" role="img"></svg>
<div>
<label for="sa"><span data-t="sh"></span>：<b id="sv">20</b>°</label><input type="range" id="sa" min="0" max="180" value="20">
<label for="ea"><span data-t="el"></span>：<b id="ev">10</b>°</label><input type="range" id="ea" min="0" max="150" value="10">
<div class="score"><div><small data-t="tg"></small><b id="tgv">120°</b></div><div><small data-t="acc"></small><b id="acc">0%</b></div><div><small data-t="pk"></small><b id="pk">20°</b></div></div>
<div class="fb" id="fb" role="status" aria-live="polite"></div>
<button class="btn" id="auto"></button>
</div></div></div>

<div class="card" data-g="2">
<h2 data-t="h1"></h2>
<label data-t="lc"></label><div class="opts" id="cond"></div>
<label data-t="ls"></label><div class="opts" id="stage"></div>
<label data-t="la"></label><div class="opts" id="age"></div>
<label for="pain"><span data-t="lp"></span>：<b id="pv">3</b> / 10</label>
<input type="range" id="pain" min="0" max="10" value="3">
<div class="mu"><span data-t="p0"></span></div>
<button class="btn go" id="gen" data-t="gen"></button>
</div>

<div class="card hide" id="out" data-g="2">
<h2 data-t="h2"></h2>
<div id="alert"></div>
<p id="sum"></p>
<div style="margin-top:.8rem"><span data-t="prog"></span> <b id="pp">0%</b></div>
<div class="bar"><i id="pb"></i></div>
<div id="list"></div>
<div class="tip" id="adj"></div>
</div>

<div class="card hide" id="ag" data-g="2">
<h2 data-t="ha"></h2><p class="mu" data-t="da"></p>
<ol class="trace" id="trace"></ol>
<div id="gate"></div>
<h3 data-t="hm"></h3>
<div class="opts" id="mdl"></div>
<pre id="mf" tabindex="0"></pre>
<details><summary data-t="hf"></summary><pre id="fh" tabindex="0"></pre></details>
</div>

<div class="card" data-g="2">
<h2 data-t="h3"></h2>
<button class="btn" id="log" data-t="log"></button><button class="btn g" id="clr" data-t="clr"></button>
<div class="chart" id="chart"></div>
</div>

<div class="card" data-g="3" id="dash">
<h2 data-t="xdh"></h2><div class="warn" data-t="xsy"></div>
<div class="opts" id="pts"></div><div id="pd"></div>
<p class="mu" style="margin-top:.7rem" data-t="xdn"></p>
</div>

<div class="card" data-g="4">
<h2 data-t="h4"></h2>
<div class="grid" id="ai"></div>
</div>

<div class="card" data-g="5">
<h2 data-t="xth"></h2><table class="tb" id="tb"></table>
<h3 data-t="xuh"></h3><p data-t="xiu"></p><p style="margin-top:.5rem" data-t="xfair"></p>
</div>

<div class="card" data-g="5">
<h2 data-t="h5"></h2>
<ul id="stop"></ul>
<div class="tip" data-t="disc"></div>
</div>
<div class="card" data-g="6">
<h2 data-t="hr"></h2>
<div class="road" id="road"></div>
<div class="tip" data-t="priv"></div>
</div>

</main>
<footer data-t="foot"></footer>
<nav id="bn" class="hide"><i id="bpg"></i><button type="button" id="bprev">‹</button><div id="bd"></div><button type="button" id="bnext">›</button><button type="button" id="bpz">⏸</button><button type="button" id="bx">✕</button></nav>
